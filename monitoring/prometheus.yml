global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/adeguard-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: adeguard-api
    metrics_path: /metrics
    static_configs:
      # Container-to-container DNS; localhost here would be Prometheus itself.
      - targets: ["api:8000"]
