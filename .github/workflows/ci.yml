name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-api.txt
          python -m pip install pytest

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest

  infrastructure-checks:
    name: CloudFormation template checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for infrastructure lint
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install template validator
        run: python -m pip install -r requirements-infra.txt

      - name: Validate the learning template offline
        run: cfn-lint -t infra/aws-demo.yaml -r us-east-1

  docker-build:
    name: Docker build and smoke test
    # Keep tested images on this runner until every prerequisite has passed.
    needs: [backend-tests, monitoring-tests, infrastructure-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.publish.outputs.api_digest }}
      frontend_digest: ${{ steps.publish.outputs.frontend_digest }}
      namespace: ${{ steps.publish.outputs.namespace }}
    env:
      COMPOSE_PROJECT_NAME: adeguard-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for HTTP checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API and frontend images
        run: docker compose build

      - name: Start services and wait for readiness
        run: docker compose up -d --wait --wait-timeout 240

      - name: Check frontend and API prediction
        run: python scripts/smoke_test.py

      - name: Install browser test tooling
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Verify real browser flows
        run: python -m scripts.browser_checks

      - name: Save browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: outputs/browser/
          if-no-files-found: warn
          retention-days: 7

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/ghcr-docker-config
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the tested API and frontend images
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ghcr-docker-config
        run: |
          set -euo pipefail
          namespace="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo '## Published container images'
            echo
            echo "Source commit: $GITHUB_SHA"
            echo
            echo '| Service | Commit tag | Exact digest reference |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for service in api frontend; do
            # Use the image ID of the container that passed the smoke test.
            container_id="$(docker compose ps -q "$service")"
            test -n "$container_id"
            tested_image="$(docker inspect --format '{{.Image}}' "$container_id")"
            image="ghcr.io/$namespace/adeguard-$service"
            target="$image:sha-$GITHUB_SHA"
            docker image tag "$tested_image" "$target"
            docker image push "$target"
            digest_ref="$(docker image inspect "$target" --format '{{json .RepoDigests}}' | python -c 'import json, sys; print(next(ref for ref in json.load(sys.stdin) if ref.startswith(sys.argv[1] + "@sha256:")))' "$image")"
            # Backticks are literal Markdown formatting, not shell substitutions.
            # shellcheck disable=SC2016
            printf '| %s | `%s` | `%s` |\n' "$service" "$target" "$digest_ref" >> "$GITHUB_STEP_SUMMARY"
            printf '%s_digest=%s\n' "$service" "${digest_ref##*@sha256:}" >> "$GITHUB_OUTPUT"
          done
          printf 'namespace=%s\n' "$namespace" >> "$GITHUB_OUTPUT"

      - name: Log out of GitHub Container Registry
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ghcr-docker-config
        run: docker logout ghcr.io

      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100

      - name: Clean up services
        if: always()
        timeout-minutes: 2
        run: docker compose down --remove-orphans

  monitoring-tests:
    name: Monitoring rules and notification delivery
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: adeguard-monitoring-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for HTTP checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate monitoring Compose configuration
        run: docker compose --profile monitoring config --quiet

      - name: Validate Prometheus configuration and rules
        run: docker compose --profile monitoring run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml

      - name: Test alert timing and recovery with simulated samples
        run: docker compose --profile monitoring run --rm --no-deps --volume ./monitoring/tests:/etc/prometheus/tests:ro --entrypoint promtool prometheus test rules /etc/prometheus/tests/alerts.test.yml

      - name: Validate Alertmanager routing
        run: docker compose --profile monitoring run --rm --no-deps --entrypoint amtool alertmanager check-config /etc/alertmanager/alertmanager.yml

      - name: Build local notification receiver
        run: docker compose --profile monitoring build notification-receiver

      - name: Start local delivery services
        run: docker compose --profile monitoring up -d --wait --wait-timeout 120 notification-receiver alertmanager

      - name: Verify firing and recovery webhook delivery
        run: python scripts/monitoring_smoke_test.py

      - name: Show monitoring status and logs on failure
        if: failure()
        run: |
          docker compose --profile monitoring ps --all
          docker compose --profile monitoring logs --no-color --tail 100

      - name: Clean up disposable monitoring services and data
        if: always()
        timeout-minutes: 2
        run: docker compose --profile monitoring down --remove-orphans --volumes

  release-verification:
    name: Verify published release
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE: compose.release.yaml
      COMPOSE_PROJECT_NAME: adeguard-release-ci
      ADEGUARD_REGISTRY: ghcr.io
      ADEGUARD_NAMESPACE: ${{ needs.docker-build.outputs.namespace }}
      ADEGUARD_API_DIGEST: ${{ needs.docker-build.outputs.api_digest }}
      ADEGUARD_FRONTEND_DIGEST: ${{ needs.docker-build.outputs.frontend_digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for HTTP checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate published digest selection
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ADEGUARD_API_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ADEGUARD_FRONTEND_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test -n "$ADEGUARD_NAMESPACE"
          docker compose config --quiet
          docker compose config --images

      - name: Log in for published image pulls
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/ghcr-release-config
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull the published images by digest
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ghcr-release-config
        run: docker compose pull

      - name: Start release without building
        run: docker compose up -d --no-build --pull never --wait --wait-timeout 240

      - name: Verify the running published release
        run: python scripts/smoke_test.py

      - name: Record the verified release selection
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '# Verified source commit: %s\n' "$GITHUB_SHA"
            printf '# Workflow run: %s/%s/actions/runs/%s (attempt %s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'ADEGUARD_REGISTRY=%s\n' "$ADEGUARD_REGISTRY"
            printf 'ADEGUARD_NAMESPACE=%s\n' "$ADEGUARD_NAMESPACE"
            printf 'ADEGUARD_API_DIGEST=%s\n' "$ADEGUARD_API_DIGEST"
            printf 'ADEGUARD_FRONTEND_DIGEST=%s\n' "$ADEGUARD_FRONTEND_DIGEST"
          } > "$RUNNER_TEMP/verified-release.env"
          {
            echo '## Verified published release'
            echo
            echo "Source commit: $GITHUB_SHA"
            echo
            echo "API: $ADEGUARD_REGISTRY/$ADEGUARD_NAMESPACE/adeguard-api@sha256:$ADEGUARD_API_DIGEST"
            echo
            echo "Frontend: $ADEGUARD_REGISTRY/$ADEGUARD_NAMESPACE/adeguard-frontend@sha256:$ADEGUARD_FRONTEND_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save verified release selection
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-release.env
          if-no-files-found: error
          retention-days: 30

      - name: Show release status and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100

      - name: Clean up release services
        if: always()
        timeout-minutes: 2
        run: docker compose down --remove-orphans

      - name: Log out of the release registry session
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ghcr-release-config
        run: docker logout ghcr.io

