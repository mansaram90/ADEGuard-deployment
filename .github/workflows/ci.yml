name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-api.txt
          python -m pip install pytest

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest

  docker-build:
    name: Docker build and smoke test
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: adeguard-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for HTTP checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API and frontend images
        run: docker compose build

      - name: Start services and wait for readiness
        run: docker compose up -d --wait --wait-timeout 240

      - name: Check frontend and API prediction
        run: python scripts/smoke_test.py

      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100

      - name: Clean up services
        if: always()
        timeout-minutes: 2
        run: docker compose down --remove-orphans

