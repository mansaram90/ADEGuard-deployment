server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Expose prediction only; metrics and operational endpoints stay internal.
    location = /api/predict {
        # Docker's embedded DNS. Resolve again after API container recreation.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $adeguard_backend api:8000;
        proxy_pass http://$adeguard_backend/predict;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    location /api/ {
        return 404;
    }
}
